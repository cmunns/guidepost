name: Release

# Publishes to npm when a version tag is pushed. `npm run release` creates and
# pushes that tag, so the local command and this workflow are two halves of one
# flow. Publishing lives here rather than on a laptop because the npm account
# requires 2FA on writes, which a granular token satisfies non-interactively.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.5)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # Fail with a clear message rather than a 404 from the registry.
      - name: Check publish credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create a granular token on npmjs.com and run: gh secret set NPM_TOKEN"
            exit 1
          fi
          npm whoami

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "${{ github.event.inputs.tag || github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
